name: Русский человекочитаемый слой

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Проверка русских сообщений
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить русский человекочитаемый слой
        run: python scripts/validate_russian_messages.py
