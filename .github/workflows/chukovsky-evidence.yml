name: Доказательства Чуковского

on:
  push:
    branches:
      - main
      - chukovsky
    paths:
      - 'studies/chukovsky-zhivoy-kak-zhizn/**'
      - 'libraries/chukovsky/**'
      - 'scripts/validate_chukovsky_evidence.py'
      - '.github/workflows/chukovsky-evidence.yml'
  pull_request:
    paths:
      - 'studies/chukovsky-zhivoy-kak-zhizn/**'
      - 'libraries/chukovsky/**'
      - 'scripts/validate_chukovsky_evidence.py'
      - '.github/workflows/chukovsky-evidence.yml'

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Скомпилировать валидатор доказательств
        run: python -m compileall -q scripts/validate_chukovsky_evidence.py
      - name: Проверить происхождение внешних доказательств Чуковского
        run: python scripts/validate_chukovsky_evidence.py
