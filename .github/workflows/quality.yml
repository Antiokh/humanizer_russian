name: quality

on:
  push:
    branches:
      - main
      - agent/**
      - feature/**
      - context/**
      - docs/**
      - gal
      - ilyakhov
      - chukovsky
  pull_request:

jobs:
  python-and-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile Python
        run: python -m compileall -q scripts

      - name: Validate architecture contract
        run: python scripts/validate_architecture.py

      - name: Validate knowledge libraries
        run: python scripts/validate_libraries.py

      - name: Validate Chukovsky study and integration matrix
        run: python scripts/validate_chukovsky_study.py

      - name: Validate Chukovsky dual-runtime library routing
        run: python scripts/validate_chukovsky_library.py

      - name: Validate Ilyakhov source study
        run: python scripts/validate_pishi_study.py

      - name: Validate Ilyakhov dual-runtime library routing
        run: python scripts/validate_ilyakhov_library.py

      - name: Validate Nora Gal study and library routing
        run: python scripts/validate_nora_gal.py

      - name: Linter self-test
        run: python scripts/lint.py --self-test

      - name: Native library provenance self-test
        run: python scripts/lint_native.py

      - name: Chukovsky normalized adapter self-test
        run: python scripts/lint_chukovsky.py

      - name: Ilyakhov normalized adapter self-test
        run: python scripts/lint_ilyakhov.py

      - name: Nora Gal normalized adapter self-test
        run: python scripts/lint_gal.py --self-test

      - name: Nora Gal live-model harness offline self-test
        run: python scripts/run_model_evals.py --self-test

      - name: Deterministic mechanical linter benchmark
        run: python scripts/benchmark_lint.py

      - name: Nora Gal compact integration benchmark
        run: python scripts/benchmark_lint.py tests/gal_compact_cases.json

      - name: Chukovsky source-linter self-test
        run: python scripts/chukovsky_checks.py

      - name: Chukovsky deterministic extended benchmark
        run: python scripts/benchmark_chukovsky.py

      - name: Ilyakhov deterministic source benchmark
        run: python scripts/benchmark_ilyakhov.py

      - name: Nora Gal deterministic source and dual-runtime benchmark
        run: python scripts/benchmark_gal.py

      - name: Deterministic editorial board benchmark
        run: python scripts/benchmark_board.py

      - name: Nora Gal editorial-board integration benchmark
        run: python scripts/benchmark_board.py tests/gal_board_cases.json

      - name: Smoke-test board JSON output
        run: |
          printf '%s' 'Это не ошибка в расчёте, а ошибка в исходных данных.' | python scripts/review.py --format json >/tmp/board.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/board.json', encoding='utf-8'))
          assert report['mode'] == 'editorial_board', report
          assert report['style']['id'] == 'neutral', report
          assert report['board']['groups'], report
          PY

      - name: Smoke-test Chukovsky in compact and board runtimes
        run: |
          printf '%s' 'Следует отметить, что резервная копия завершилась в 03:10.' | python scripts/check.py --extended --json >/tmp/chuk-compact.json
          printf '%s' 'Следует отметить, что резервная копия завершилась в 03:10.' | python scripts/review.py --libraries native,chukovsky --format json >/tmp/chuk-board.json
          printf '%s' 'Следует отметить, что резервная копия завершилась в 03:10.' | python scripts/review.py --libraries native,chukovsky --style rslive_content --format json >/tmp/chuk-rslive.json
          python - <<'PY'
          import json
          compact = json.load(open('/tmp/chuk-compact.json', encoding='utf-8'))
          board = json.load(open('/tmp/chuk-board.json', encoding='utf-8'))
          rslive = json.load(open('/tmp/chuk-rslive.json', encoding='utf-8'))
          assert any(item.get('library_id') == 'chukovsky' and item.get('phenomenon_id') == 'editing.metadiscourse_announcement' for item in compact['findings']), compact
          assert any(item.get('library_id') == 'chukovsky' and item.get('rule_id') == 'CHUK-R24' for item in board['findings']), board
          assert not any(item.get('library_id') == 'native' and str(item.get('legacy_rule', '')).startswith('chukovsky:') for item in board['findings']), board
          assert not any(str(key).startswith('chukovsky_') for key in board['metrics'].get('native', {})), board
          assert rslive['style']['id'] == 'rslive_content', rslive
          assert any(item.get('rule_id') == 'CHUK-R24' for item in rslive['findings']), rslive
          PY

      - name: Smoke-test Ilyakhov in compact and board runtimes
        run: |
          printf '%s' 'Осуществляется проведение проверки.' | python scripts/check.py --json >/tmp/ily-default.json
          printf '%s' 'В данной статье мы рассмотрим три способа резервного копирования.' | python scripts/check.py --extended --json >/tmp/ily-extended.json
          printf '%s' 'Осуществляется проведение проверки.' | python scripts/review.py --libraries ilyakhov,chukovsky --format json >/tmp/ily-board.json
          printf '%s' 'В данной статье мы рассмотрим три способа резервного копирования.' | python scripts/review.py --libraries ilyakhov --style rslive_content --format json >/tmp/ily-rslive.json
          python - <<'PY'
          import json
          default = json.load(open('/tmp/ily-default.json', encoding='utf-8'))
          extended = json.load(open('/tmp/ily-extended.json', encoding='utf-8'))
          board = json.load(open('/tmp/ily-board.json', encoding='utf-8'))
          rslive = json.load(open('/tmp/ily-rslive.json', encoding='utf-8'))
          assert any(item.get('library_id') == 'ilyakhov' and item.get('rule') == 'ILY-M01' for item in default['findings']), default
          assert any(item.get('library_id') == 'ilyakhov' and item.get('rule') == 'ILY-R62' for item in extended['findings']), extended
          assert any(item.get('rule_id') == 'ILY-M01' for item in board['findings']), board
          assert any(item.get('rule_id') == 'CHUK-R17' for item in board['findings']), board
          groups = [g for g in board['board']['groups'] if g['phenomenon_id'] == 'editing.action_hidden_in_nominalization']
          assert len(groups) == 1 and groups[0]['status'] == 'MAJORITY', board
          assert rslive['style']['id'] == 'rslive_content', rslive
          assert any(item.get('rule_id') == 'ILY-R62' for item in rslive['findings']), rslive
          PY

      - name: Smoke-test and validate author profiler
        run: |
          tmpdir="$(mktemp -d)"
          printf '%s' 'Документ без точки' > "$tmpdir/one.txt"
          printf '%s\n' 'Новый документ начинается здесь. Ну вот, ещё фраза.' > "$tmpdir/two.txt"
          python scripts/profile_author.py "$tmpdir" -o "$tmpdir/profile.json"
          python - "$tmpdir/profile.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          profile_path = Path(sys.argv[1])
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          schema = json.loads(Path("profiles/schema.json").read_text(encoding="utf-8"))

          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(profile)

          assert profile["version"] == 1
          assert profile["settings"]["imitate_errors"] is False
          assert profile["corpus"]["documents"] == 2
          assert "files" not in profile["corpus"]

          ngrams = {
              item["text"]
              for group in profile["lexicon"]["ngrams"].values()
              for item in group
          }
          assert "точки новый" not in ngrams
          PY

      - name: Validate JSON fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('.').rglob('*.json')):
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              print(path)
          PY