name: quality

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

jobs:
  python-and-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile Python
        run: python -m compileall -q scripts

      - name: Linter self-test
        run: python scripts/lint.py --self-test

      - name: Smoke-test and validate author profiler
        run: |
          tmpdir="$(mktemp -d)"
          printf '%s' 'Документ без точки' > "$tmpdir/one.txt"
          printf '%s\n' 'Новый документ начинается здесь. Ну вот, ещё фраза.' > "$tmpdir/two.txt"
          python scripts/profile_author.py "$tmpdir" -o "$tmpdir/profile.json"
          python - "$tmpdir/profile.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          profile_path = Path(sys.argv[1])
          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          schema = json.loads(Path("profiles/schema.json").read_text(encoding="utf-8"))

          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(profile)

          assert profile["version"] == 1
          assert profile["settings"]["imitate_errors"] is False
          assert profile["corpus"]["documents"] == 2
          assert "files" not in profile["corpus"]

          ngrams = {
              item["text"]
              for group in profile["lexicon"]["ngrams"].values()
              for item in group
          }
          assert "точки новый" not in ngrams
          PY

      - name: Validate JSON fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('.').rglob('*.json')):
              with path.open(encoding='utf-8') as f:
                  json.load(f)
              print(path)
          PY

      - name: Validate Nora Gal eval traceability
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          suite = json.loads(Path('evals/nora-gal.json').read_text(encoding='utf-8'))
          mapping = json.loads(Path('evals/nora-gal-map.json').read_text(encoding='utf-8'))
          reference = Path('references/nora-gal.md').read_text(encoding='utf-8')
          rule_index = Path('references/nora-gal-rule-index.md').read_text(encoding='utf-8')

          assert suite['version'] == 2
          assert mapping['version'] == 1

          eval_ids = [item['id'] for item in suite['evals']]
          map_ids = [item['id'] for item in mapping['cases']]

          assert len(eval_ids) == 42, len(eval_ids)
          assert len(eval_ids) == len(set(eval_ids)), 'duplicate Nora Gal eval ids'
          assert map_ids == eval_ids, 'traceability map must cover evals in the same order'
          assert eval_ids == [f'gal-{i:02d}' for i in range(1, 43)]

          for item in suite['evals']:
              assert item['prompt'].strip()
              assert len(item['expectations']) >= 3
              assert all(x.strip() for x in item['expectations'])

          all_mapped_rules = set()
          counterexamples = 0
          for item in mapping['cases']:
              assert item['rules']
              assert item['chapters']
              if item['counterexample']:
                  counterexamples += 1
              for rule in item['rules']:
                  assert re.fullmatch(r'GAL-[A-Z0-9-]+', rule), rule
                  assert f'`{rule}`' in reference, f'{rule} missing from nora-gal.md'
                  assert f'`{rule}`' in rule_index, f'{rule} missing from rule index'
                  all_mapped_rules.add(rule)

          declared_rules = set(re.findall(r'`(GAL-[A-Z0-9-]+)`', rule_index))
          assert len(declared_rules) == 42, len(declared_rules)
          assert all_mapped_rules <= declared_rules
          assert counterexamples >= 8, counterexamples
          PY
