name: Качество Виссон

on:
  push:
    branches:
      - visson
  pull_request:
    paths:
      - 'libraries/visson/**'
      - 'studies/lynn-visson/**'
      - 'references/*visson*'
      - 'reviewers/visson.json'
      - 'scripts/*visson*'
      - 'scripts/check.py'
      - 'scripts/review.py'
      - 'scripts/lint.py'
      - 'tests/visson*'
      - 'evals/lynn-visson*'
      - '.github/workflows/visson-quality.yml'

permissions:
  contents: read

jobs:
  visson-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Установить зависимость для валидации
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Скомпилировать Python
        run: python -m compileall -q scripts
      - name: Проверить архитектуру
        run: python scripts/validate_architecture.py
      - name: Проверить библиотеки
        run: python scripts/validate_libraries.py
      - name: Проверить исследование Виссон
        run: python scripts/validate_visson.py
      - name: Самотест основного линтера
        run: python scripts/lint.py --self-test
      - name: Самотест линтера Виссон
        run: python scripts/lint_visson.py --self-test
      - name: Стандартный бенчмарк Compact
        run: python scripts/benchmark_lint.py
      - name: Бенчмарк Compact для Виссон
        run: python scripts/benchmark_lint.py tests/visson_compact_cases.json
      - name: Бенчмарк источника и двух режимов Виссон
        run: python scripts/benchmark_visson.py
      - name: Стандартный бенчмарк редколлегии
        run: python scripts/benchmark_board.py
      - name: Бенчмарк редколлегии для Виссон
        run: python scripts/benchmark_board.py tests/visson_board_cases.json
      - name: Проверить все JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path('.').rglob('*.json')):
              with path.open(encoding='utf-8') as f:
                  json.load(f)
          print('Все JSON: OK')
          PY
