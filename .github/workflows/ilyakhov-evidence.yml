name: Доказательства Ильяхова

on:
  push:
    branches:
      - main
      - ilyakhov
    paths:
      - 'studies/pishi-sokrashchay/**'
      - 'libraries/ilyakhov/**'
      - 'scripts/validate_ilyakhov_evidence.py'
      - '.github/workflows/ilyakhov-evidence.yml'
  pull_request:
    paths:
      - 'studies/pishi-sokrashchay/**'
      - 'libraries/ilyakhov/**'
      - 'scripts/validate_ilyakhov_evidence.py'
      - '.github/workflows/ilyakhov-evidence.yml'

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Скомпилировать валидатор доказательств
        run: python -m compileall -q scripts/validate_ilyakhov_evidence.py
      - name: Проверить соответствие внешних доказательств Ильяхова
        run: python scripts/validate_ilyakhov_evidence.py
