name: rosenthal-quality

on:
  push:
    branches:
      - rosenthal
  pull_request:
    paths:
      - 'libraries/rosenthal/**'
      - 'reviewers/rosenthal.json'
      - 'scripts/lint_rosenthal.py'
      - 'scripts/validate_rosenthal.py'
      - 'scripts/benchmark_rosenthal.py'
      - 'tests/rosenthal_cases.json'
      - 'studies/rosenthal-pravopisanie-literaturnaya-pravka/**'
      - 'references/rosenthal.md'
      - '.github/workflows/rosenthal-quality.yml'

jobs:
  rosenthal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Validate knowledge libraries
        run: python scripts/validate_libraries.py
      - name: Validate Rosenthal study and library
        run: python scripts/validate_rosenthal.py
      - name: Rosenthal adapter self-test
        run: python scripts/lint_rosenthal.py --self-test
      - name: Rosenthal deterministic benchmark
        run: python scripts/benchmark_rosenthal.py
      - name: Smoke-test Rosenthal compact and board routing
        run: |
          set +e
          python scripts/check.py --extended --json <<< 'Согласно приказа директора документ вступает в силу.' >/tmp/ros-compact.json
          compact_status=$?
          set -e
          test "$compact_status" -eq 1
          python scripts/review.py --libraries rosenthal --format json <<< 'Согласно приказа директора документ вступает в силу.' >/tmp/ros-board.json
          python - <<'PY'
          import json
          compact=json.load(open('/tmp/ros-compact.json',encoding='utf-8'))
          board=json.load(open('/tmp/ros-board.json',encoding='utf-8'))
          assert any(x.get('library_id')=='rosenthal' and x.get('rule')=='ROS-R44' for x in compact['findings']), compact
          assert any(x.get('library_id')=='rosenthal' and x.get('rule_id')=='ROS-R44' for x in board['findings']), board
          PY
