name: Качество Розенталя

on:
  push:
    branches: [rosenthal]
  pull_request:
    paths:
      - 'libraries/rosenthal/**'
      - 'reviewers/rosenthal.json'
      - 'scripts/lint_rosenthal.py'
      - 'scripts/validate_rosenthal.py'
      - 'scripts/benchmark_rosenthal*.py'
      - 'tests/rosenthal_cases.json'
      - 'studies/rosenthal-*/**'
      - 'references/rosenthal.md'
      - '.github/workflows/rosenthal-quality.yml'

jobs:
  rosenthal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Установить зависимость для валидации
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Скомпилировать Python
        run: python -m compileall -q scripts
      - name: Проверить архитектуру
        run: python scripts/validate_architecture.py
      - name: Проверить библиотеки знаний
        run: python scripts/validate_libraries.py
      - name: Проверить накопительное исследование и библиотеку Розенталя
        run: python scripts/validate_rosenthal.py
      - name: Самотест основного линтера
        run: python scripts/lint.py --self-test
      - name: Самотест адаптера Розенталя
        run: python scripts/lint_rosenthal.py --self-test
      - name: Бенчмарк Compact
        run: python scripts/benchmark_lint.py
      - name: Бенчмарк редколлегии
        run: python scripts/benchmark_board.py
      - name: Детерминированный бенчмарк Розенталя
        run: python scripts/benchmark_rosenthal.py
      - name: Бенчмарк сохранения для цикла 3 Розенталя
        run: python scripts/benchmark_rosenthal_cycle3.py
      - name: Бенчмарк происхождения и сохранения для цикла 4 Розенталя
        run: python scripts/benchmark_rosenthal_cycle4.py
      - name: Бенчмарк сохранения пунктуации для цикла 5 Розенталя
        run: python scripts/benchmark_rosenthal_cycle5.py
      - name: Бенчмарк несобственно-прямой речи и происхождения для цикла 6 Розенталя
        run: python scripts/benchmark_rosenthal_cycle6.py
      - name: Проверить JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('Все JSON: OK')
          PY
      - name: Проверить маршрутизацию накопительной библиотеки Розенталя в Compact и редколлегии
        run: |
          set +e
          python scripts/check.py --extended --json <<< 'Этот вариант более лучше предыдущего.' >/tmp/ros-compact.json
          compact_status=$?
          set -e
          test "$compact_status" -eq 1
          python scripts/review.py --libraries rosenthal --format json <<< 'Этот вариант более лучше предыдущего.' >/tmp/ros-board.json
          python - <<'PY'
          import json
          compact=json.load(open('/tmp/ros-compact.json',encoding='utf-8'))
          board=json.load(open('/tmp/ros-board.json',encoding='utf-8'))
          def has_r53(item):
              if item.get('library_id')=='rosenthal' and item.get('rule')=='ROS-R53': return True
              return any(p.get('library_id')=='rosenthal' and p.get('rule_id')=='ROS-R53' for p in item.get('provenance',[]))
          assert any(has_r53(x) for x in compact['findings']), compact
          assert any(x.get('library_id')=='rosenthal' and x.get('rule_id')=='ROS-R53' for x in board['findings']), board
          PY
