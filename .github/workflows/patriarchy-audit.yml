name: Временный аудит Patriarchy

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Прогнать опубликованный русский корпус Patriarchy
        run: python scripts/audit_patriarchy_public.py

      - name: Сохранить полный отчёт
        uses: actions/upload-artifact@v4
        with:
          name: patriarchy-humanizer-report
          path: |
            patriarchy-humanizer-report.json
            patriarchy-humanizer-summary.json
          if-no-files-found: error
